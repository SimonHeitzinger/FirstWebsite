<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR-Strahler Simulation</title>
    <!-- Pfad zu deiner CSS -->
    <link rel="stylesheet" href="../../../css/style.css">
        <style>
        /* Spezielle Anpassung nur für diese Seite */
        .container {
            /* Hebt die Breitenbeschränkung deiner style.css auf */
            max-width: 95% !important; 
            width: 95% !important;
            margin: 0 auto;
            padding-top: 20px;
        }

        .iframe-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            /* 900px Höhe ist gut, damit das Bild und die Regler gleichzeitig passen */
            height: 900px; 
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        /* Optimierung für sehr große Bildschirme */
        @media (min-width: 1600px) {
            iframe { height: 950px; }
        }
    </style>
</head>
<body>
    
    <header id="menu-container"></header>

    <!-- Wir nutzen 'container', damit die Abstände zum Menü wie auf der Startseite sind -->
    <div class="container">
        <h1>IR-Strahler Simulation</h1>
        
        <div style="margin-top: 20px;">
            <iframe 
                src="https://pythonwebapp-42dk.onrender.com/" >
            </iframe>
        </div>
    </div>

    <!-- Skripte laden -->
    <script src="../../../js/menuLoader.js"></script>
    <script src="csvConverter.js"></script> 
</body>
</html>
